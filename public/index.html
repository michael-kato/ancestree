<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ancestree</title>
<meta name="description" content="One shared human tree. Free to view. Open to registered contributors.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/elkjs@0.12.0/lib/elk.bundled.js" defer></script>
<script type="module" src="/app.js"></script>
<style>
:root {
  --prussian: #4b6078;
  --prussian-deep: #51647a;
  --print: #f3f5f7;
  --print-dim: #edf1f5;
  --sun: #ffe29b;
  --paper: #202c3b;
  --paper-2: #2e4054;
  --ink: #ecf2fa;
  --ink-soft: #bbc8d8;
  --card-ink: #172638;
  --card-ink-soft: #304159;
  --rule: #66798e;
  --danger: #ffb4a7;
  --focus: #ffe29b;
  --font: "Atkinson Hyperlegible Next", system-ui, sans-serif;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body, #root { margin: 0; height: 100%; }
body { font-family: var(--font); font-size: 16px; line-height: 1.5; color: var(--ink); background: var(--paper); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { line-height: 1.2; margin: 0; }
p { margin: 0; }
a { color: inherit; }
[hidden] { display: none !important; }

.ground { background: #111b29; color: var(--print); }

.btn {
  display: inline-flex; align-items: center; gap: var(--s2); min-height: 40px; padding: 0 var(--s4);
  border-radius: 8px; border: 1.5px solid var(--ink); background: var(--ink); color: var(--paper);
  font-weight: 600; cursor: pointer;
}
.btn:hover { filter: brightness(1.15); }
.btn.quiet { background: transparent; color: var(--ink); border-color: var(--rule); }
.btn.danger { background: transparent; color: var(--danger); border-color: currentColor; }
.btn.quiet:hover, .btn.danger:hover { filter: none; background: var(--paper-2); }
.btn.danger-solid { background: var(--danger); border-color: var(--danger); color: var(--paper); }
.btn.small { min-height: 32px; padding: 0 var(--s3); font-size: 14px; }
.btn:disabled { opacity: .5; cursor: default; }
.link { background: none; border: 0; padding: 0; color: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; justify-self: start; }

label.field { display: grid; gap: var(--s1); font-size: 14px; font-weight: 600; color: var(--ink-soft); }
.field input, .field select, .field textarea, .composer textarea {
  width: 100%; padding: 9px 11px; border: 1.5px solid var(--rule); border-radius: 8px;
  background: var(--paper); color: var(--ink); font-weight: 400; font-size: 16px;
}
.field textarea, .composer textarea { resize: vertical; min-height: 84px; }
.field .hint { font-weight: 400; }
.field [aria-invalid="true"] { border-color: var(--danger); }
.with-button { position: relative; display: flex; }
.with-button input:not(.picker) { padding-right: 44px; }
.with-button .picker { position: absolute; right: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.icon-btn { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; display: grid; place-items: center; border: 0; border-radius: 6px; background: none; color: var(--ink-soft); cursor: pointer; }
.icon-btn:hover { background: var(--paper-2); color: var(--ink); }
.place { position: relative; }
.suggest { position: absolute; z-index: 5; left: 0; right: 0; top: 100%; margin: 4px 0 0; padding: 4px; list-style: none; background: var(--paper); border: 1.5px solid var(--rule); border-radius: 8px; box-shadow: 0 12px 28px -12px rgba(6, 18, 44, .5); font-weight: 400; font-size: 15px; color: var(--ink); }
.suggest li { padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.suggest li:hover, .suggest li[aria-selected="true"] { background: var(--paper-2); }
.field input:focus, .field select:focus, .field textarea:focus, .composer textarea:focus { border-color: var(--ink); outline: none; }
.row { display: flex; gap: var(--s3); flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); }
.stack { display: grid; gap: var(--s4); }
.hint { font-size: 14px; color: var(--ink-soft); }
.check { display: flex; gap: var(--s2); align-items: center; }
.check input { width: 18px; height: 18px; accent-color: var(--prussian); }
.more summary { cursor: pointer; font-weight: 600; color: var(--ink-soft); padding: var(--s1) 0; }
.more[open] summary { margin-bottom: var(--s3); }
.error { color: var(--danger); font-size: 14px; }

/* Sign-in and tree list: centred on the print. */
.front { min-height: 100%; display: grid; place-items: center; padding: var(--s6) var(--s4); }
.front-inner { width: min(440px, 100%); display: grid; gap: var(--s6); }
.wordmark { font-size: clamp(44px, 9vw, 72px); font-weight: 700; letter-spacing: -.03em; line-height: 1; }
.wordmark-sub { margin-top: var(--s3); color: var(--print-dim); font-size: 18px; max-width: 30ch; }
.sheet { background: var(--paper); color: var(--ink); border-radius: 14px; padding: var(--s5); display: grid; gap: var(--s4); box-shadow: 0 18px 40px -18px rgba(6, 18, 44, .7); }
.sheet h2 { font-size: 20px; }
/* Tree workspace */
.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 400px; grid-template-rows: auto minmax(0, 1fr); }
.bar { grid-column: 1 / -1; display: flex; align-items: center; gap: var(--s4); padding: var(--s2) var(--s4); border-bottom: 1px solid var(--rule); background: var(--paper); min-height: 56px; }
.bar .home { font-weight: 600; text-decoration: none; font-size: 18px; }
.bar .spacer { flex: 1; }
.person-picker { width: 180px; min-height: 32px; padding: 4px 8px; border: 1.5px solid var(--rule); border-radius: 8px; background: var(--paper); color: var(--ink); font-size: 14px; }
.modes { display: inline-flex; border: 1.5px solid var(--rule); border-radius: 8px; padding: 2px; }
.modes button { border: 0; background: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: 600; color: var(--ink-soft); }
.modes button[aria-pressed="true"] { background: var(--prussian); color: var(--print); }

.stage { position: relative; overflow: hidden; }
.stage svg { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
.stage svg:active { cursor: grabbing; }
.empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: var(--s5); pointer-events: none; }
.empty > div { pointer-events: auto; display: grid; gap: var(--s4); justify-items: center; max-width: 34ch; font-size: 18px; }
.empty .btn { background: var(--print); color: var(--prussian); border-color: var(--print); }

.person rect { fill: var(--relation-color, #d4deeb); stroke: var(--relation-color, #d4deeb); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.person .name { fill: var(--card-ink); font-weight: 600; font-size: 15px; }
.person .years { fill: var(--card-ink-soft); font-size: 13px; }
.person { cursor: pointer; transition: opacity .18s; }
.person:focus-visible { opacity: 1 !important; }
.person:hover rect { stroke: var(--print); stroke-width: 3; }
.person:focus { outline: none; }
.person:focus-visible rect { stroke: var(--focus); stroke-width: 3; }
.person.selected rect { stroke: var(--sun); stroke-width: 3; }
.person.selected .name { fill: var(--card-ink); }
.person.selected .years { fill: var(--card-ink-soft); }
.person .lock { fill: var(--card-ink); font-size: 9px; font-weight: 700; }
.relation-legend { position: absolute; top: 12px; left: 12px; max-width: min(340px, calc(100% - 24px)); padding: 8px 12px; border-radius: 8px; background: var(--paper); color: var(--ink); font-size: 12px; display: grid; gap: 4px; pointer-events: none; }
.relation-scale { display: flex; gap: 2px; color: var(--card-ink); }
.relation-scale span { text-align: center; min-width: 28px; padding: 2px 4px; }
.person.lit rect { animation: expose 1.6s ease-out; }
@keyframes expose {
  0% { fill: var(--sun); stroke: var(--sun); }
  35% { fill: rgba(244, 193, 82, .35); stroke: var(--sun); }
}
.badge circle { fill: var(--print); stroke: var(--prussian); stroke-width: 2; }
.badge text { fill: var(--prussian); font-size: 11px; font-weight: 700; }
.union { fill: var(--print); }
/* Connection dots: shown on hover / selection while editing the live tree. */
.port { display: none; cursor: crosshair; }
.can-grow .editable .port { display: inline; opacity: 0; transition: opacity .15s; }
.can-grow .person.editable:hover .port, .can-grow .person.editable.selected .port, .can-grow .person.editable:focus-visible .port { opacity: 1; }
.port .hit { fill: transparent; }
.port .dot { fill: var(--prussian); stroke: var(--print); stroke-width: 2; }
.port:hover .dot { fill: var(--sun); stroke: var(--sun); }
.drag-line { fill: none; stroke: var(--sun); stroke-width: 2; stroke-dasharray: 6 5; pointer-events: none; }
.person.drop-target rect { stroke: var(--sun); stroke-width: 3; }
.quick-add { position: absolute; transform: translate(-50%, -50%); width: 240px; display: grid; gap: var(--s2); padding: var(--s3); border-radius: 12px; background: var(--paper); color: var(--ink); box-shadow: 0 18px 40px -16px rgba(6, 18, 44, .8); border: 2px solid var(--sun); z-index: 4; }
.quick-title { font-weight: 600; font-size: 14px; }
.quick-names { display: grid; gap: var(--s1); }
.quick-names input { width: 100%; padding: 7px 9px; border: 1.5px solid var(--rule); border-radius: 8px; background: var(--paper); color: var(--ink); font-size: 15px; }
.quick-names input:focus { border-color: var(--ink); outline: none; }
@media (hover: none) { .can-grow .person.selected .port .dot { r: 9; } }
.edge { fill: none; stroke: color-mix(in oklab, var(--edge-color) 55%, var(--print)); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; transition: opacity .18s; pointer-events: none; }
.edge.highlighted { stroke: var(--sun); stroke-width: 3; }
.edge.chosen { stroke-dasharray: 5 4; }

/* Replay / generations player sits on the print like an exposure strip. */
.player { position: absolute; left: var(--s4); right: var(--s4); bottom: var(--s4); display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: var(--s3) var(--s4); padding: var(--s3) var(--s4); border-radius: 14px; background: var(--paper); color: var(--ink); }
.player .controls { display: flex; gap: var(--s1); }
.player button.icon { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 999px; border: 1.5px solid var(--rule); background: none; color: var(--ink); cursor: pointer; }
.player button.icon:hover { border-color: var(--ink); }
.player button.icon.play { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.player input[type="range"] { width: 100%; accent-color: var(--sun); }
.player select { background: var(--paper); color: var(--ink); border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; }
.player select option { color: var(--ink); }
.caption { grid-column: 1 / -1; display: flex; align-items: baseline; gap: var(--s4); min-height: 28px; flex-wrap: wrap; }
.caption .big { font-size: 28px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.caption .what { font-size: 16px; }
.caption .when { font-size: 14px; color: var(--ink-soft); }
.caption .restore { margin-left: auto; }
.caption .restore .btn { background: transparent; color: var(--ink); border-color: var(--rule); }

/* Side panel */
.panel { border-left: 1px solid var(--rule); background: var(--paper); display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; }
.tabs { display: flex; gap: var(--s4); padding: 0 var(--s4); border-bottom: 1px solid var(--rule); overflow-x: auto; scrollbar-width: none; }
.tabs button { border: 0; background: none; padding: var(--s3) 0; cursor: pointer; color: var(--ink-soft); font-weight: 600; border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--prussian); }
.panel-body { overflow-y: auto; padding: var(--s5) var(--s4); display: grid; gap: var(--s5); align-content: start; }
.portrait { width: 112px; height: 112px; border-radius: 50%; object-fit: cover; border: 3px solid var(--paper-2); }
.person-head { display: grid; gap: var(--s2); }
.person-head h2 { font-size: 26px; font-weight: 600; }
.facts { display: grid; gap: var(--s1); }
.notes { white-space: pre-wrap; }
.section { display: grid; gap: var(--s3); }
.section h3 { font-size: 16px; }
.kin { list-style: none; padding: 0; margin: 0; display: grid; gap: var(--s1); }
.kin li { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s3); }
.kin .link { text-align: left; overflow-wrap: anywhere; }
.kin .rel { color: var(--ink-soft); font-size: 14px; }
.actions { display: flex; flex-wrap: wrap; gap: var(--s2); }

.thread { list-style: none; padding: 0; margin: 0; display: grid; gap: var(--s4); }
.thread .replies { list-style: none; margin: var(--s3) 0 0; padding-left: var(--s4); border-left: 2px solid var(--rule); display: grid; gap: var(--s3); }
.note-head { display: flex; gap: var(--s2); align-items: baseline; flex-wrap: wrap; }
.note-head strong { font-weight: 600; }
.note-head time, .note-head .edited { color: var(--ink-soft); font-size: 13px; }
.note-body { white-space: pre-wrap; overflow-wrap: anywhere; }
.note-tools { display: flex; gap: var(--s3); font-size: 14px; color: var(--ink-soft); margin-top: var(--s1); }
.composer { display: grid; gap: var(--s2); }

.history { list-style: none; padding: 0; margin: 0; display: grid; }
.history li { padding: var(--s3) 0; border-bottom: 1px solid var(--rule); display: grid; gap: var(--s1); }
.history .meta { font-size: 14px; color: var(--ink-soft); }
.ask { border: 0; border-radius: 14px; padding: var(--s5); width: min(420px, calc(100% - 32px)); background: var(--paper); color: var(--ink); box-shadow: 0 24px 60px -20px rgba(6, 18, 44, .7); }
.ask::backdrop { background: rgba(10, 28, 60, .55); }
.ask h2 { font-size: 20px; }
.toast { position: fixed; left: 50%; bottom: var(--s5); transform: translateX(-50%); max-width: min(560px, calc(100% - 32px)); padding: var(--s3) var(--s4); border-radius: 10px; background: var(--ink); color: var(--paper); box-shadow: 0 10px 30px -10px rgba(6, 18, 44, .6); z-index: 10; }
.toast.error { background: var(--danger); color: var(--paper); }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 58vh auto; height: auto; min-height: 100%; }
  .panel { border-left: 0; border-top: 1px solid var(--rule); }
  .panel-body { overflow: visible; }
  .bar { flex-wrap: wrap; }
  .bar .spacer { display: none; }
  .modes { order: 3; width: 100%; justify-content: center; }
  .player { left: var(--s2); right: var(--s2); bottom: var(--s2); padding: var(--s2) var(--s3); }
  .caption .big { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) {
  .person, .edge { transition: none; }
  .person.lit rect { animation: none; stroke: var(--sun); }
}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
